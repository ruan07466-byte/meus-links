<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@maur.books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eaf5fb;
    --bg-2: #fffbe9;
    --blue: #bfe2f5;
    --blue-deep: #8fcdf0;
    --yellow: #fff2b8;
    --ink: #35455a;
    --ink-dim: #6c7c90;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 0%, rgba(143,205,240,0.55), transparent 50%),
      radial-gradient(circle at 88% 20%, rgba(255,242,184,0.6), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }

  main{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--blue-deep), var(--yellow), var(--blue), var(--blue-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .avatar span{
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
  }

  h1{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 40px);
    margin: 0 0 8px;
    text-align: center;
    letter-spacing: -0.01em;
  }

  p.tagline{
    margin: 0 0 34px;
    color: var(--ink-dim);
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    max-width: 300px;
  }

  .links{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px 20px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--ink);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 17px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 0 rgba(143,205,240,0.35);
  }

  .link-card:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(143,205,240,0.35);
  }

  .link-card svg{
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  .link-card .handle{
    font-family: 'Manrope', sans-serif;
    font-weight: 500;
    font-size: 13px;
    opacity: 0.65;
    display: block;
    margin-top: 2px;
  }

  .link-card .label-wrap{
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .instagram{ background: var(--blue); }
  .tiktok{ background: var(--yellow); }
  .youtube{ background: var(--blue-deep); }

  footer{
    margin-top: 44px;
    color: var(--ink-dim);
    font-size: 12px;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    .link-card{ transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="avatar"><span>MB</span></div>
  <h1>@maur.books</h1>
  <p class="tagline">Tudo em um lugar só. Escolhe aí embaixo pra onde quer ir.</p>

  <div class="links">
    <a class="link-card instagram" href="https://www.instagram.com/maur.books" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="label-wrap">
        <span class="platform">Instagram</span>
        <span class="handle">@maur.books</span>
      </span>
    </a>

    <a class="link-card tiktok" href="https://www.tiktok.com/@maur.books" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M16.5 3c.3 1.9 1.5 3.4 3.4 3.7v2.6c-1.3.1-2.5-.3-3.4-1v6.4c0 3.1-2.5 5.3-5.4 5.3-3 0-5.4-2.4-5.4-5.4 0-3 2.6-5.5 5.7-5.3v2.7c-1.5-.2-2.9.9-2.9 2.5 0 1.5 1.2 2.7 2.7 2.7 1.6 0 2.9-1.3 2.9-2.9V3h2.4z"/>
      </svg>
      <span class="label-wrap">
        <span class="platform">TikTok</span>
        <span class="handle">@maur.books</span>
      </span>
    </a>

    <a class="link-card youtube" href="https://www.youtube.com/@AllAboutRuan" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5.5" width="19" height="13" rx="4"/>
        <path d="M10.5 9.5l5 2.5-5 2.5v-5z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="label-wrap">
        <span class="platform">YouTube</span>
        <span class="handle">AllAboutRuan</span>
      </span>
    </a>
  </div>

  <footer>feito com carinho ✦</footer>
</main>
</body>
</html>
